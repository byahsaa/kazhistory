<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Voices of the Steppe | KazHistory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --midnight:#1B1A18;
  --ink2:#141311;
  --mocha:#453424;
  --coffee:#715838;
  --camel:#B59C78;
  --red:#C10733;
  --red-soft:#E8526D;
  --paper:#EFE6D8;
  --paper-2:#CDBFAA;
  --line:rgba(181,156,120,.2);
  --line-2:rgba(181,156,120,.36);
  --f-d:"Fraunces","Roslindale",Georgia,"Times New Roman",serif;
  --f-u:"Figtree","Basier Circle",Arial,sans-serif;
  --gutter:clamp(16px,4vw,64px);
  --ease:cubic-bezier(.2,.7,.1,1);
}
html,body{height:100%}
body{margin:0;background:var(--midnight);color:var(--paper);font:400 16px/1.55 var(--f-u);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--camel);outline-offset:3px}
::selection{background:var(--red);color:var(--paper)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px var(--gutter);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-family:var(--f-d);font-weight:600;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--red);display:block}
.brand span{font-family:var(--f-u);font-weight:500;font-size:13px;color:var(--paper-2);letter-spacing:0}
.tabs{display:flex;background:var(--ink2);border:1px solid var(--line-2);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--paper-2);cursor:pointer;white-space:nowrap;transition:background .3s,color .3s}
.tab:hover{color:var(--paper)}
.tab[aria-selected="true"]{background:var(--camel);color:var(--midnight)}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--paper);white-space:nowrap}
.ibtn:hover{border-color:var(--camel);background:rgba(69,52,36,.5)}
.ibtn svg{width:16px;height:16px;flex:none}
.timer{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:999px;padding:3px 3px 3px 12px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:46px}
.clock.warn{color:var(--red-soft)}
.timer .ibtn{border:0;padding:6px 9px}

/* ---------- stage & slides ---------- */
.stage{position:relative;overflow:hidden;touch-action:pan-y;--px:0;--py:0}
.stage.swap .slide.is-active{opacity:0;transform:scale(.97)}
.slide{position:absolute;inset:0;display:flex;opacity:0;visibility:hidden;transform:scale(.92);
  transition:opacity .55s var(--ease),transform 1s var(--ease),visibility 0s linear 1s}
.slide.is-past{transform:scale(1.08)}
.slide.is-active{opacity:1;visibility:visible;transform:none;
  transition:opacity .75s var(--ease) .12s,transform 1.05s var(--ease),visibility 0s}
.slide-inner{position:relative;z-index:3;box-sizing:border-box;width:min(1220px,100%);margin:auto;
  padding:clamp(18px,4vh,48px) var(--gutter);max-height:100%;overflow-y:auto;
  translate:5vw 0;transition:translate 1.05s var(--ease)}
.is-active .slide-inner{translate:0 0}
.is-past .slide-inner{translate:-5vw 0}
.plx-wrap{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;translate:16vw 0;transition:translate 1.3s var(--ease)}
.is-active .plx-wrap{translate:0 0}
.is-past .plx-wrap{translate:-16vw 0}
.plx{position:absolute;transform:translate3d(calc(var(--px) * var(--d,20) * -1px),calc(var(--py) * var(--d,20) * -1px),0);transition:transform .35s linear;will-change:transform}
.glyph{right:-.03em;bottom:-.14em;font-family:var(--f-d);font-weight:600;font-size:clamp(150px,29vw,430px);line-height:.8;color:var(--mocha);letter-spacing:-.045em;white-space:nowrap;opacity:.72}
.hero-svg{left:-5%;top:-6%;width:110%;height:112%}
.scene{left:-4%;top:-5%;width:108%;height:110%}

/* per-slide grounds */
.slide{background:var(--bg,var(--midnight))}
.slide.t-deep{--bg:#231A13}
.slide.t-mocha{--bg:#3A2B1E}
.slide.t-red{--bg:#A8062C}
.slide.t-red .eyebrow,.slide.t-red p.tx,.slide.t-red .big{color:var(--paper)}
.slide.t-red .eyebrow::before{background:var(--paper)}
.slide.t-red .glyph{color:#7E0421;opacity:.8}
.slide.t-light{--bg:#E9DFCF;color:var(--midnight)}
.slide.t-light .eyebrow{color:#6A4F30}
.slide.t-light .eyebrow::before{background:var(--red)}
.slide.t-light .big,.slide.t-light b{color:var(--midnight)}
.slide.t-light p.tx{color:#4A3A29}
.slide.t-light .glyph{color:#D6C6AE;opacity:1}
.slide.t-light .term{color:var(--midnight);text-decoration-color:var(--red)}

/* photo layer */
.photo{left:-4%;top:-4%;width:108%;height:108%}
.photo img{width:100%;height:100%;object-fit:cover;object-position:62% 30%;display:block;max-width:none}
.is-active .photo img{animation:kb 16s ease-out both}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,26,24,.96) 0%,rgba(27,26,24,.86) 34%,rgba(27,26,24,.35) 62%,rgba(27,26,24,.15) 100%),linear-gradient(0deg,rgba(27,26,24,.75) 0%,rgba(27,26,24,0) 30%)}
.slide.has-photo .scrim{background:linear-gradient(90deg,rgba(27,26,24,.95) 0%,rgba(27,26,24,.86) 45%,rgba(27,26,24,.74) 100%)}
.side{top:0;bottom:0;right:0;left:auto;width:min(50%,760px);height:100%}
.side img,.dip img{height:100%;object-fit:cover;object-position:center 20%;display:block;max-width:none}
.side img{width:100%}
.side,.dip{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
.dip{top:0;bottom:0;right:0;left:auto;width:min(58%,900px);height:100%;display:flex;gap:6px}
.dip img{flex:1 1 0;min-width:0;width:50%}
.is-active .side img,.is-active .dip img{animation:kb 16s ease-out both}
.scrim-side{position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,26,24,.9) 0%,rgba(27,26,24,.55) 42%,rgba(27,26,24,.08) 70%,rgba(27,26,24,.25) 100%)}
.band{position:absolute;left:0;right:0;bottom:0;height:clamp(96px,24%,250px);z-index:2;-webkit-mask-image:linear-gradient(0deg,#000 60%,transparent);mask-image:linear-gradient(0deg,#000 60%,transparent)}
.band img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;max-width:none;opacity:.9}
.slide.has-band .slide-inner{padding-bottom:calc(clamp(96px,24%,250px) + 8px)}
/* sources slide */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:0}
.slide .links + *,.links .lnk b{font-size:14px}
.lnk{padding:11px 14px!important}
.links h3{grid-column:1/-1;margin:14px 0 2px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--camel)}
.links h3:first-child{margin-top:0}
.lnk{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:rgba(69,52,36,.55);border:1px solid var(--line);text-decoration:none;color:var(--paper);transition:background .2s,border-color .2s}
.lnk:hover{background:var(--mocha);border-color:var(--camel)}
.lnk b{font-weight:600;font-size:15px;line-height:1.3}
.lnk span{font-size:12.5px;color:var(--camel);letter-spacing:.02em}
.cap{position:absolute;right:var(--gutter);bottom:14px;z-index:4;font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--paper-2);background:rgba(20,19,17,.6);padding:4px 9px;border-radius:999px}
.slide.has-photo .glyph{display:none}

.is-active .r{animation:rise .95s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms + 260ms)}
@keyframes rise{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}

/* ---------- type ---------- */
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--camel)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--red);flex:none}
h1.t{font-family:var(--f-d);font-weight:600;font-size:clamp(46px,7.6vw,118px);line-height:.94;letter-spacing:-.028em;margin:0;max-width:12ch;text-wrap:balance}
h1.t em,h2.t em{font-style:italic;font-weight:400;color:var(--camel)}
h2.t{font-family:var(--f-d);font-weight:600;font-size:clamp(30px,4.3vw,60px);line-height:1.02;letter-spacing:-.022em;margin:0 0 20px;max-width:17ch;text-wrap:balance}
.big{font-family:var(--f-d);font-weight:400;font-style:italic;font-size:clamp(28px,4.1vw,56px);line-height:1.1;letter-spacing:-.012em;max-width:21ch;margin:0 0 24px;text-wrap:balance}
.lead{font-size:clamp(17px,1.7vw,22px);line-height:1.5;color:var(--paper-2);max-width:48ch;margin:22px 0 0}
p.tx{font-size:clamp(16px,1.35vw,19px);line-height:1.62;color:var(--paper-2);max-width:60ch;margin:0 0 14px}
b,strong{color:var(--paper);font-weight:600}
.term{border:0;background:none;padding:0;color:var(--paper);font:inherit;cursor:help;text-decoration:underline dotted var(--camel);text-decoration-thickness:2px;text-underline-offset:4px}
.term:hover{color:var(--camel)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.chip{font-size:12.5px;font-weight:600;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--paper-2)}
.chip.on{background:var(--red);border-color:var(--red);color:var(--paper)}
.hint{margin-top:26px;font-size:13.5px;color:var(--paper-2);display:flex;align-items:center;gap:10px}
.kbd{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;border:1px solid var(--line-2);font-weight:700;font-size:12px;color:var(--paper)}

/* ---------- article + facts ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:start}
.facts{display:flex;flex-direction:column;gap:20px;padding-left:24px;border-left:1px solid var(--line-2)}
.fact .n{font-family:var(--f-d);font-weight:600;font-size:clamp(32px,3.5vw,50px);line-height:1;color:var(--camel);font-variant-numeric:tabular-nums}
.fact .l{font-size:14.5px;color:var(--paper-2);margin-top:6px}

/* ---------- ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:8px;margin:6px 0 22px}
.rung{display:flex;align-items:center;gap:14px}
.rung .bar{box-sizing:border-box;height:36px;border-radius:8px;background:var(--mocha);display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--camel);width:var(--w);min-width:max-content;transition:width 1.1s var(--ease)}
.rung.top .bar{background:var(--red);color:var(--paper)}
.rung .c{font-variant-numeric:tabular-nums;font-weight:700;color:var(--paper-2);font-size:14px}
.slide:not(.is-active) .rung .bar{width:0}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:20px;position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--line-2)}
.tl li{position:relative;padding-top:32px}
.tl li::before{content:"";position:absolute;top:4px;left:0;width:11px;height:11px;border-radius:50%;background:var(--coffee)}
.tl li.key::before{background:var(--red);box-shadow:0 0 0 6px rgba(193,7,51,.2)}
.tl .y{font-family:var(--f-d);font-weight:600;font-size:clamp(26px,2.7vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.tl li.key .y{color:var(--camel)}
.tl .h{font-weight:700;font-size:15.5px;margin:10px 0 4px}
.tl .d{font-size:14.5px;line-height:1.5;color:var(--paper-2)}
.quote{margin:28px 0 0;padding:18px 22px;border-radius:14px;background:rgba(20,19,17,.55);max-width:62ch}
.quote p{margin:0;font-family:var(--f-d);font-style:italic;font-size:clamp(18px,1.8vw,24px);line-height:1.35}
.quote small{display:block;margin-top:8px;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--camel)}

/* ---------- carousel ---------- */
.car{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,31.5%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 14px;margin-top:22px;scrollbar-width:thin;scrollbar-color:var(--coffee) transparent}
.card{scroll-snap-align:start;background:var(--mocha);border-radius:16px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;min-height:210px}
.card .pos{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--camel)}
.card h3{font-family:var(--f-d);font-weight:600;font-size:25px;line-height:1.08;margin:0}
.card p{margin:0;font-size:15px;line-height:1.55;color:var(--paper-2)}
.card.threat{background:var(--red)}
.card.threat .pos,.card.threat p{color:var(--paper)}
.car-ctl{display:flex;align-items:center;gap:10px;margin-top:6px}
.car-ctl .count{margin-left:4px}
.rbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--paper)}
.rbtn:hover{background:var(--mocha)}
.rbtn:disabled{opacity:.3;cursor:default;background:transparent}
.rbtn svg{width:18px;height:18px}

/* ---------- split ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.col{background:var(--mocha);border-radius:16px;padding:24px 24px 26px}
.col.red{background:var(--red)}
.col h3{font-size:12.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:0 0 14px;color:var(--camel)}
.col.red h3{color:var(--paper)}
.col p{margin:0 0 12px;font-size:16.5px;line-height:1.55}
.col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.col li{position:relative;padding-left:20px;font-size:16.5px;line-height:1.5}
.col li::before{content:"";position:absolute;left:0;top:.72em;width:9px;height:2px;background:currentColor;opacity:.75}
.col .small{margin:14px 0 0;font-size:13.5px;font-weight:600;letter-spacing:.04em;color:var(--camel)}
.col.red .small{color:var(--paper)}
.col.red .term{text-decoration-color:var(--paper)}

/* ---------- uluses strip ---------- */
.strip{display:flex;gap:8px;margin-top:6px;min-height:150px}
.seg{flex:var(--w) 1 0;border:0;border-radius:14px;padding:16px 16px 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:14px;color:var(--paper);transition:filter .2s,transform .3s var(--ease)}
.seg:hover{filter:brightness(1.12)}
.seg[aria-pressed="true"]{outline:2px solid var(--paper);outline-offset:3px}
.seg-a{background:var(--red)}.seg-b{background:var(--coffee)}.seg-c{background:var(--mocha)}
.seg .who{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.seg .where{font-family:var(--f-d);font-weight:600;font-size:clamp(18px,2vw,26px);line-height:1.08}
.detail{margin-top:14px;padding:18px 22px;border-radius:14px;background:var(--ink2);border:1px solid var(--line)}
.detail .tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--camel)}
.detail h3{font-family:var(--f-d);font-weight:600;font-size:24px;margin:6px 0 6px}
.detail p{margin:0;color:var(--paper-2);font-size:16px;line-height:1.55;max-width:64ch}

/* ---------- chain ---------- */
.chain{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin:26px 0 22px}
.st{position:relative;padding:20px 22px 0 0;border-top:2px solid var(--coffee)}
.st::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--coffee)}
.st:last-child{border-top-color:var(--red)}
.st:last-child::before{background:var(--red)}
.st .n{display:block;font-family:var(--f-d);font-weight:600;font-size:clamp(21px,2.1vw,30px);line-height:1.08}
.st .d{display:block;margin-top:7px;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--camel)}
.st .x{margin:8px 0 0;font-size:14.5px;line-height:1.5;color:var(--paper-2)}

/* ---------- bottom bar ---------- */
.bot{display:flex;align-items:center;gap:12px;padding:10px var(--gutter) 14px;border-top:1px solid var(--line)}
.nav{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--paper)}
.nav:hover{background:var(--mocha)}
.nav.next{background:var(--camel);border-color:var(--camel);color:var(--midnight)}
.nav.next:hover{background:var(--paper)}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:20px;height:20px}
.pager{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
.pg{flex:1;height:30px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;min-width:8px}
.pg span{display:block;width:100%;height:3px;border-radius:3px;background:var(--mocha);transition:background .35s,height .35s}
.pg:hover span{background:var(--camel)}
.pg.seen span{background:var(--coffee)}
.pg[aria-current="true"] span{background:var(--red);height:6px}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--paper-2);white-space:nowrap}
.count b{color:var(--paper)}

/* ---------- popovers ---------- */
.pop{position:fixed;z-index:40;box-sizing:border-box;width:min(340px,calc(100vw - 24px));background:var(--paper);color:var(--midnight);border-radius:14px;padding:14px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5);font-size:14.5px;line-height:1.5;opacity:0;translate:0 6px;transition:opacity .2s,translate .25s var(--ease)}
.pop.show{opacity:1;translate:0 0}
.pop h4{margin:0 0 4px;font-family:var(--f-d);font-weight:600;font-size:19px}
.pop p{margin:0}
.sec-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:min(56vh,440px);overflow:auto}
.sec-list button{width:100%;display:flex;gap:12px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--midnight);font-size:14.5px}
.sec-list button:hover{background:rgba(113,88,56,.14)}
.sec-list button[aria-current="true"]{background:var(--midnight);color:var(--paper)}
.sec-list .nn{font-variant-numeric:tabular-nums;font-weight:700;color:var(--coffee);min-width:20px}
.sec-list button[aria-current="true"] .nn{color:var(--camel)}

/* ---------- dialogs ---------- */
dialog.dlg{border:0;padding:0;background:var(--paper);color:var(--midnight);border-radius:20px;width:min(760px,calc(100vw - 32px));max-height:min(82vh,780px);box-shadow:0 30px 90px rgba(0,0,0,.55)}
dialog.dlg[open]{display:flex;flex-direction:column;animation:dlgIn .45s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
dialog.dlg::backdrop{background:rgba(12,11,10,.72);backdrop-filter:blur(5px)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid rgba(69,52,36,.16)}
.dlg-h .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.dlg-h h2{margin:2px 0 0;font-family:var(--f-d);font-weight:600;font-size:22px;line-height:1.15}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:60;background:var(--midnight);display:grid;place-items:center;cursor:pointer;animation:introOut .7s var(--ease) 1.65s forwards}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:18px}
.intro-mark{font-family:var(--f-d);font-weight:600;font-size:clamp(48px,10vw,140px);letter-spacing:-.04em;line-height:.9;animation:introZoom 1.5s var(--ease) both}
.intro-mark em{font-style:italic;font-weight:400;color:var(--camel)}
.intro-bar{height:3px;width:0;background:var(--red);border-radius:3px;animation:introBar 1.1s var(--ease) .35s forwards}
.intro-sub{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-2);animation:fadeIn .8s ease .55s both}
@keyframes introZoom{from{opacity:0;transform:scale(2.3);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes introBar{to{width:min(220px,40vw)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes introOut{to{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}}
.intro.done{display:none}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .cols,.split{grid-template-columns:1fr}

  .strip{flex-direction:column;min-height:0}
  .car{grid-auto-columns:82%}
  .side,.dip{width:100%;-webkit-mask-image:none;mask-image:none;opacity:.4}

  .cap{left:var(--gutter);right:var(--gutter);text-align:center}
  .ibtn .lbl,.brand span{display:none}
  .tab .long{display:none}
}
@media (max-width:520px){

}
@media (prefers-reduced-motion:reduce){

  .slide,.slide-inner,.plx-wrap,.rung .bar{transition:none!important}

  .car{scroll-behavior:auto}
}

        script:"Good morning, everyone. Today, I will be presenting on a crucial turning point in Kazakhstan's history: the early 20th century. This was a period when the Kazakh intelligentsia realized that the survival of their people depended on political organization and national awakening. We will look at their brief participation in the Second State Duma of the Russian Empire, and how the loss of that platform led to the creation of two monumental publications: Aykap magazine and Kazakh newspaper." },

        script:"The first major milestone was Aykap magazine, founded in 1911 by Mukhamedzhan Seralin. Aykap took a very pragmatic, reformist approach to the crisis. Seralin argued that the old nomadic way of life was no longer viable under imperial law. The magazine’s core argument was that Kazakhs needed to transition to sedentary farming. Why? Because under Russian law, only settled farmers could secure legal title to their land. Aykap also championed modern secular education and the rights of women, pushing for rapid socio-economic modernization." },

        script:"It is easy to look at Aykap and Kazakh and see them as opponents. And they did debate heavily. On land: Aykap wanted settlement to secure legal deeds; Kazakh wanted to protect the pastoral economy. On language: Aykap was open to integrating Tatar words, while Kazakh fought for a pure Kazakh literary language. However, this was not a destructive rivalry. It was a high-level national dialogue. They were debating the best path forward to save the same nation." },

    h += '<p class="tx r" style="--i:2">' + rich(s.p) + '</p>';
    h += '<ol class="tl r" style="--i:3;--n:' + s.items.length + '">';
    s.items.forEach(function(t){ h += '<li class="' + (t.key ? "key" : "") + '"><div class="y">' + t.y + '</div><div class="h">' + t.h + '</div><div class="d">' + rich(t.d) + '</div></li>'; });
    h += '</ol>';
    if(s.quote) h += '<div class="quote r" style="--i:4"><p>' + s.quote[0] + '</p><small>' + s.quote[1] + '</small></div>';
  }
  if(s.type === "carousel"){
    h += eyebrow(s.eyebrow, 0);
    h += '<h2 class="t r" style="--i:1">' + s.h + '</h2>';
    h += '<p class="tx r" style="--i:2">' + rich(s.p) + '</p>';
    h += '<div class="car r" style="--i:3" tabindex="0" aria-label="Neighbours of the Kazakh Khanate">';
    s.cards.forEach(function(c){ h += '<article class="card' + (c.threat ? " threat" : "") + '"><span class="pos">' + c.pos + '</span><h3>' + c.name + '</h3><p>' + rich(c.text) + '</p></article>'; });
    h += '</div><div class="car-ctl r" style="--i:4"><button class="rbtn" type="button" data-car="-1" aria-label="Previous card">' + ARROW_L + '</button><button class="rbtn" type="button" data-car="1" aria-label="Next card">' + ARROW_R + '</button><span class="count car-count"></span></div>';
  }
  if(s.type === "chain"){
    h += eyebrow(s.eyebrow, 0);
    h += '<h2 class="t r" style="--i:1">' + s.h + '</h2>';
    h += '<p class="tx r" style="--i:2">' + rich(s.p) + '</p>';
    h += '<div class="chain r" style="--i:3;--n:' + s.stations.length + '">';
    s.stations.forEach(function(t){ h += '<div class="st"><span class="n">' + t[0] + '</span><span class="d">' + t[1] + '</span>' + (t[2] ? '<p class="x">' + rich(t[2]) + '</p>' : "") + '</div>'; });
    h += '</div>';
    if(s.p2) h += '<p class="tx r" style="--i:4">' + rich(s.p2) + '</p>';
  }
  bg += '<div class="plx glyph" style="--d:34" aria-hidden="true">' + s.glyph + '</div>';
  if(s.type === "links"){
    h += eyebrow(s.eyebrow, 0);
    h += '<h2 class="t r" style="--i:1">' + s.h + '</h2>';
    h += '<div class="links r" style="--i:2">';
    s.groups.forEach(function(g){
      h += '<h3>' + g[0] + '</h3>';
      g[1].forEach(function(l){ var host = ""; try { host = new URL(l[1]).hostname.replace(/^www\./, ""); } catch(e){} h += '<a class="lnk" href="' + l[1] + '" target="_blank" rel="noopener"><b>' + l[0] + '</b><span>' + host + ' ↗</span></a>'; });
    });
    h += '</div>';
  }
  var cls = "slide" + (s.tone && !mode ? " " + s.tone : "") + (mode ? " has-photo" : "") + (mode === "band" ? " has-band" : "");
  var cap = s.cap ? '<div class="cap">' + s.cap + '</div>' : "";
  return '<section class="' + cls + '" data-i="' + idx + '" aria-roledescription="slide" aria-label="' + (idx + 1) + ': ' + strip(s.title) + '"><div class="plx-wrap">' + bg + '</div><div class="slide-inner">' + h + '</div>' + cap + '</section>';
}

/* =========================================================
   STATE
   ========================================================= */
var stage = $("stage"), pager = $("pager"), countEl = $("count");
var topic = "w3", cur = 0, seen = {};
var slides = [];

function buildTabs(){
  $("tabs").innerHTML = ORDER.map(function(k){
    var t = TOPICS[k];
    return '<button class="tab" role="tab" type="button" data-topic="' + k + '" aria-selected="' + (k === topic) + '">' + t.short + '<span class="long"> · ' + t.long + '</span></button>';
  }).join("");
}
function buildDeck(){
  var T = TOPICS[topic];
  stage.innerHTML = T.slides.map(function(s, i){ return renderSlide(s, i, topic); }).join("");
  slides = Array.prototype.slice.call(stage.querySelectorAll(".slide"));
  pager.innerHTML = T.slides.map(function(s, i){ return '<button class="pg" type="button" data-go="' + i + '" aria-label="Slide ' + (i + 1) + ': ' + strip(s.title) + '"><span></span></button>'; }).join("");
  $("secList").innerHTML = T.slides.map(function(s, i){ return '<li><button type="button" data-go="' + i + '"><span class="nn">' + String(i + 1).padStart(2, "0") + '</span>' + strip(s.title) + '</button></li>'; }).join("");
  seen = {};
  stage.querySelectorAll(".car").forEach(updateCarCount);
}
function go(n, instant){
  var max = slides.length - 1;
  n = Math.max(0, Math.min(max, n));
  cur = n; seen[n] = true;
  slides.forEach(function(el, i){
    el.classList.toggle("is-active", i === n);
    el.classList.toggle("is-past", i < n);
    el.setAttribute("aria-hidden", i === n ? "false" : "true");
    if(i === n){ el.removeAttribute("inert"); } else { el.setAttribute("inert", ""); }
  });
  Array.prototype.forEach.call(pager.children, function(b, i){
    b.setAttribute("aria-current", i === n ? "true" : "false");
    b.classList.toggle("seen", !!seen[i] && i !== n);
  });
  Array.prototype.forEach.call($("secList").querySelectorAll("button"), function(b, i){ b.setAttribute("aria-current", i === n ? "true" : "false"); });
  countEl.innerHTML = "<b>" + String(n + 1).padStart(2, "0") + "</b> / " + String(slides.length).padStart(2, "0");
  $("prev").disabled = n === 0;
  $("next").disabled = n === max;
  hidePops();
  try { history.replaceState(null, "", "#" + topic + "/" + (n + 1)); } catch(e){}
  if($("scriptDlg").open) fillScript();
}
function setTopic(k, n){
  if(!TOPICS[k]) k = "w3";
  var changed = k !== topic || !slides.length;
  topic = k;
  if(changed){
    stage.classList.add("swap");
    var run = function(){
      buildTabs(); buildDeck(); go(n || 0);
      requestAnimationFrame(function(){ stage.classList.remove("swap"); });
    };
    if(slides.length && !reduce){ setTimeout(run, 260); } else { run(); }
  } else {
    go(n || 0);
  }
  try { localStorage.setItem("kh-topic", k); } catch(e){}
}
function fromHash(){
  var m = /^#(w\d+)\/(\d+)$/.exec(location.hash || "");
  if(m && TOPICS[m[1]]) return { k:m[1], n:Math.max(0, parseInt(m[2], 10) - 1) };
  var saved = null;
  try { saved = localStorage.getItem("kh-topic"); } catch(e){}
  return { k: TOPICS[saved] ? saved : "w3", n:0 };
}

/* =========================================================
   EVENTS
   ========================================================= */
$("prev").addEventListener("click", function(){ go(cur - 1); });
$("next").addEventListener("click", function(){ go(cur + 1); });
pager.addEventListener("click", function(e){ var b = e.target.closest("[data-go]"); if(b) go(+b.getAttribute("data-go")); });
$("tabs").addEventListener("click", function(e){ var b = e.target.closest("[data-topic]"); if(b && b.getAttribute("data-topic") !== topic) setTopic(b.getAttribute("data-topic"), 0); });
$("tabs").addEventListener("keydown", function(e){
  if(e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.stopPropagation();
  var i = ORDER.indexOf(topic) + (e.key === "ArrowRight" ? 1 : -1);
  i = (i + ORDER.length) % ORDER.length;
  setTopic(ORDER[i], 0);
  setTimeout(function(){ var b = $("tabs").querySelector('[aria-selected="true"]'); if(b) b.focus(); }, 320);
});

/* keyboard */
document.addEventListener("keydown", function(e){
  if(document.querySelector("dialog[open]")) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  if(e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && tag !== "button")){ e.preventDefault(); go(cur + 1); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); go(cur - 1); }
  else if(e.key === "Home"){ go(0); }
  else if(e.key === "End"){ go(slides.length - 1); }
  else if(e.key === "s" || e.key === "S"){ openScript(); }
  else if(e.key === "Escape"){ hidePops(); }
});

/* swipe */
var sx = null, sy = null;
stage.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" || e.target.closest(".car, button")) { sx = null; return; }
  sx = e.clientX; sy = e.clientY;
});
stage.addEventListener("pointerup", function(e){
  if(sx === null) return;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dy) < 60) go(cur + (dx < 0 ? 1 : -1));
  sx = null;
});

/* parallax on pointer */
var raf = 0, tx = 0, ty = 0;
if(!reduce){
  stage.addEventListener("pointermove", function(e){
    if(e.pointerType !== "mouse") return;
    var r = stage.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width - .5) * 2;
    ty = ((e.clientY - r.top) / r.height - .5) * 2;
    if(!raf) raf = requestAnimationFrame(function(){ stage.style.setProperty("--px", tx.toFixed(3)); stage.style.setProperty("--py", ty.toFixed(3)); raf = 0; });
  });
  stage.addEventListener("pointerleave", function(){ stage.style.setProperty("--px", 0); stage.style.setProperty("--py", 0); });
}

/* in-slide interactions */
stage.addEventListener("click", function(e){
  var t = e.target.closest(".term");
  if(t){ e.stopPropagation(); showTerm(t); return; }
  var sg = e.target.closest("[data-seg]");
  if(sg){
    var s = TOPICS[topic].slides[cur], g = s.segs[+sg.getAttribute("data-seg")];
    var wrap = sg.closest(".slide-inner");
    wrap.querySelectorAll("[data-seg]").forEach(function(b){ b.setAttribute("aria-pressed", b === sg ? "true" : "false"); });
    var d = wrap.querySelector(".detail");
    d.innerHTML = '<div class="tag">' + g.tag + '</div><h3>' + g.who + '</h3><p>' + g.text + '</p>';
    return;
  }
  var cb = e.target.closest("[data-car]");
  if(cb){
    var car = cb.closest(".slide-inner").querySelector(".car");
    var card = car.querySelector(".card");
    var step = card ? card.getBoundingClientRect().width + 14 : 300;
    car.scrollBy({ left: step * +cb.getAttribute("data-car"), behavior: reduce ? "auto" : "smooth" });
  }
});
function updateCarCount(car){
  var inner = car.closest(".slide-inner");
  var cards = car.querySelectorAll(".card");
  if(!cards.length) return;
  var w = cards[0].getBoundingClientRect().width + 14 || 300;
  var first = Math.round(car.scrollLeft / w) + 1;
  var visible = Math.max(1, Math.round(car.clientWidth / w));
  var last = Math.min(cards.length, first + visible - 1);
  var c = inner.querySelector(".car-count");
  if(c) c.innerHTML = "<b>" + first + (last > first ? "–" + last : "") + "</b> / " + cards.length;
  var btns = inner.querySelectorAll("[data-car]");
  if(btns.length === 2){ btns[0].disabled = car.scrollLeft < 4; btns[1].disabled = car.scrollLeft + car.clientWidth >= car.scrollWidth - 4; }
}
stage.addEventListener("scroll", function(e){ if(e.target.classList && e.target.classList.contains("car")) updateCarCount(e.target); }, true);
window.addEventListener("resize", function(){ stage.querySelectorAll(".car").forEach(updateCarCount); });

/* popovers */
var termPop = $("termPop"), secPop = $("secPop");
function place(pop, anchor, above){
  pop.hidden = false;
  var r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 12);
  var top = above ? r.top - ph - 12 : r.bottom + 10;
  if(!above && top + ph > window.innerHeight - 12) top = r.top - ph - 10;
  if(top < 12) top = 12;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  requestAnimationFrame(function(){ pop.classList.add("show"); });
}
function showTerm(btn){
  var t = TOPICS[topic].terms[btn.getAttribute("data-term")];
  if(!t) return;
  hidePops();
  $("termH").textContent = t[0]; $("termP").textContent = t[1];
  place(termPop, btn, false);
}
function hidePops(){
  [termPop, secPop].forEach(function(p){ p.classList.remove("show"); p.hidden = true; });
  $("secBtn").setAttribute("aria-expanded", "false");
}
$("secBtn").addEventListener("click", function(e){
  e.stopPropagation();
  if(!secPop.hidden){ hidePops(); return; }
  hidePops();
  place(secPop, $("secBtn"), true);
  $("secBtn").setAttribute("aria-expanded", "true");
  var c = secPop.querySelector('[aria-current="true"]'); if(c) c.focus();
});
secPop.addEventListener("click", function(e){ var b = e.target.closest("[data-go]"); if(b){ go(+b.getAttribute("data-go")); $("secBtn").focus(); } });
document.addEventListener("click", function(e){ if(!e.target.closest(".pop") && !e.target.closest(".term") && e.target !== $("secBtn")) hidePops(); });
window.addEventListener("resize", hidePops);

/* dialogs */
function wordCount(s){ return s.trim().split(/\s+/).length; }
var lang = "en";
function scriptOf(x){ return lang === "ru" && x.ru ? x.ru : x.script; }
function fillScript(){
  var s = TOPICS[topic].slides[cur];
  $("scriptKicker").textContent = TOPICS[topic].short + " · Slide " + (cur + 1) + " of " + slides.length;
  $("scriptTitle").textContent = strip(s.title);
  $("scriptText").textContent = scriptOf(s);
  $("scriptText").setAttribute("lang", lang);
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
  var total = TOPICS[topic].slides.reduce(function(a, x){ return a + wordCount(scriptOf(x)); }, 0);
  var wpm = lang === "ru" ? 120 : 145;
  $("scriptWords").textContent = lang === "ru"
    ? wordCount(scriptOf(s)) + " слов · вся речь " + total + " слов ≈ " + Math.round(total / wpm * 10) / 10 + " мин"
    : wordCount(scriptOf(s)) + " words · whole talk " + total + " words ≈ " + Math.round(total / wpm * 10) / 10 + " min";
  $("sPrev").disabled = cur === 0;
  $("sNext").disabled = cur === slides.length - 1;
}
function openScript(){ hidePops(); fillScript(); $("scriptDlg").showModal(); }
$("scriptBtn").addEventListener("click", openScript);
Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function(b){
  b.addEventListener("click", function(){
    lang = b.getAttribute("data-lang");
    try { localStorage.setItem("kh-lang", lang); } catch(e){}
    fillScript();
  });
});
$("sPrev").addEventListener("click", function(){ go(cur - 1); });
$("sNext").addEventListener("click", function(){ go(cur + 1); });
$("scriptDlg").addEventListener("keydown", function(e){
  if(e.key === "ArrowRight"){ e.preventDefault(); go(cur + 1); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); go(cur - 1); }
});
$("infoBtn").addEventListener("click", function(){
  hidePops();
  var T = TOPICS[topic], h = "";
  $("infoKicker").textContent = T.short + " · " + T.long;
  h += '<h3>Pronunciation</h3><div class="tw"><table><tr><th>Name</th><th>Say</th><th>What it is</th></tr>';
  T.pron.forEach(function(p){ h += '<tr><td>' + p[0] + '</td><td class="say">' + p[1] + '</td><td class="m">' + p[2] + '</td></tr>'; });
  h += '</table></div>';
  if(T.contested.length){ h += '<h3>Contested dates</h3><ul>' + T.contested.map(function(c){ return '<li>' + c + '</li>'; }).join("") + '</ul>'; }
  h += '<h3>Sources</h3><ul>' + T.sources.map(function(c){ return '<li>' + c + '</li>'; }).join("") + '</ul>';
  $("infoBody").innerHTML = h;
  $("infoDlg").showModal();
});
Array.prototype.forEach.call(document.querySelectorAll("dialog"), function(d){
  d.addEventListener("click", function(e){ if(e.target === d || e.target.closest("[data-close]")) d.close(); });
});

/* timer */
var TOTAL = 300, left = TOTAL, running = false, tick = null;
var clock = $("clock"), timerBtn = $("timerBtn");
var PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
function fmt(s){ var neg = s < 0, a = Math.abs(s), m = Math.floor(a / 60), r = a % 60; return (neg ? "+" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
function paintClock(){ clock.textContent = fmt(left); clock.classList.toggle("warn", left <= 30); }
function stopT(){ running = false; if(tick){ clearInterval(tick); tick = null; } $("timerIco").innerHTML = PLAY; timerBtn.setAttribute("aria-label", "Start timer"); }
timerBtn.addEventListener("click", function(){
  if(running){ stopT(); return; }
  running = true; $("timerIco").innerHTML = PAUSE; timerBtn.setAttribute("aria-label", "Pause timer");
  tick = setInterval(function(){ left -= 1; paintClock(); if(left <= -90) stopT(); }, 1000);
});
$("resetBtn").addEventListener("click", function(){ stopT(); left = TOTAL; paintClock(); });
paintClock();

/* intro */
var intro = $("intro");
function endIntro(){ intro.classList.add("done"); }
intro.addEventListener("click", endIntro);
intro.addEventListener("animationend", function(e){ if(e.animationName === "introOut") endIntro(); });
if(reduce) endIntro();

/* boot */
var start = fromHash();
setTopic(start.k, start.n);
window.addEventListener("hashchange", function(){ var h = fromHash(); if(h.k !== topic) setTopic(h.k, h.n); else if(h.n !== cur) go(h.n); });
})();
</script>
